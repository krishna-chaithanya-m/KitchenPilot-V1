name: Build and Push KitchenPilot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: kitchenpilotregistry.azurecr.io
  IMAGE_NAME: kitchenpilot-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name kitchenpilotregistry

      - name: Build Docker image
        run: docker build -t "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" .

      - name: Push Docker image
        run: docker push "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
