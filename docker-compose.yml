services:
  postgres:
    image: postgres:16
    container_name: kitchenpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitchenpilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kitchenpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchenpilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATA_BACKEND: ${DATA_BACKEND:-csv}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-kitchenpilot}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-production-must-provide-high-entropy-secret-key-32b-min}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      SEMANTIC_RETRIEVAL_ENABLED: ${SEMANTIC_RETRIEVAL_ENABLED:-false}
      XGBOOST_RANKING_ENABLED: ${XGBOOST_RANKING_ENABLED:-false}
      PERSONALIZATION_ENABLED: ${PERSONALIZATION_ENABLED:-true}
      RECOMMENDATION_HISTORY_ENABLED: ${RECOMMENDATION_HISTORY_ENABLED:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
